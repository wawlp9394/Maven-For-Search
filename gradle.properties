# IntelliJ Platform Gradle Plugin 2.x 配置
# https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html

# 插件版本
pluginVersion=1.0.6

# IntelliJ Platform 最低版�?(兼容 2024.2+)
platformVersion=2024.2

# 平台类型: IC = IntelliJ IDEA Community
platformType=IC

# 不自动更�?since-until build 范围,兼容�?2026+
updateSinceUntilBuild=false

# Kotlin 代码版本
kotlin.stdlib.default.dependency=false

# 禁用 Gradle daemon,避免缓存 C 盘路�?(确保所有缓存都�?G �?
org.gradle.daemon=false

# 指定 Gradle 用户主目�?(确保不使�?C 盘默认路�?
# 注意: 此属性需要通过环境变量 GRADLE_USER_HOME 或命令行 --gradle-user-home 设置
# 这里仅作为文档说�?Gradle 不支持通过 gradle.properties 设置 gradle.user.home

# JVM 内存配置
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# 并行构建
org.gradle.parallel=true

# 配置缓存
org.gradle.configuration-cache=false

# 指定 JDK 安装路径,�?toolchain 自动检�?(JDK 21 用于编译)
org.gradle.java.installations.paths=G:/software/JDK/jdk-21,G:/software/JDK/jdk-17,G:/software/JDK/jdk-25.0.1
